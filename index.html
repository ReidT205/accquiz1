<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>ACC 1000 Quiz 1</title></head>
<body><p style="font-family:system-ui;padding:24px;color:#666">Loading study guide…</p>
<script>
(async()=>{
  const [a,b]=await Promise.all([fetch('/p1.txt'),fetch('/p2.txt')].map(p=>p.then(r=>r.text())));
  const bin=Uint8Array.from(atob((a+b).trim()),c=>c.charCodeAt(0));
  const html=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open();document.write(html);document.close();
})().catch(e=>{document.body.innerHTML='<pre style="padding:24px;font-family:system-ui">Failed to load: '+e+'</pre>';});
</script></body></html>
